name: Analyze

on:
  push:
    branches: [main, stripped]
  pull_request:
    branches: [main, stripped]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
